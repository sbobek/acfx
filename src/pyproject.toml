[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acfx"
version = "0.3.8"
description = "Actionable Counterfactual eXplanations"
readme = "README.md"
authors = [
    { name = "Szymon Bobek", email = "szymon.bobek@gmail.com" },
    { name = "Piotr Kubacki", email = "piotr.kubacki00@gmail.com"}
]
license = { text = "MIT" }
keywords = ["xai", "tabular data","explainability", "model-agnostic", "counterfactual", "causal"]

dependencies = [
    "numpy==1.26.0; python_version < '3.12'",
    "numpy>=1.26.0,<3; python_version >= '3.12'",
    "pandas==1.5.3; python_version < '3.12'",
    "pandas>=1.5.3,<4; python_version >= '3.12'",
    "scipy==1.11.4; python_version < '3.12'",
    "scipy>=1.11.4,<2; python_version >= '3.12'",
    "scikit-learn==1.6.1; python_version < '3.12'",
    "scikit-learn>=1.6.1,<2; python_version >= '3.12'",

    "optuna==4.2.0; python_version < '3.12'",
    "optuna>=4.2.0,<6; python_version >= '3.12'",
    "pgmpy==1.0.0",
    "interpret==0.7.3; python_version < '3.12'",
    "interpret>=0.7.3,<0.8; python_version >= '3.12'",
    "interpret-core==0.7.3; python_version < '3.12'",
    "interpret-core>=0.7.3,<0.8; python_version >= '3.12'",
    "overrides==7.4.0; python_version < '3.12'",
    "overrides>=7.4.0,<8; python_version >= '3.12'"
]

requires-python = ">=3.10,<3.15"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]


[project.optional-dependencies]
benchmark = [
    "tensorflow==2.14.0; python_version <= '3.11'",
    "lingam==1.9.1; python_version <= '3.11'",
    "openml==0.15.1; python_version <= '3.11'",
    "alibi==0.9.6; python_version <= '3.11'",
    "lux-explainer==1.3.2; python_version <= '3.11'",
    "networkx==3.4.2; python_version <= '3.11'",
    "cfnow==0.0.6; python_version <= '3.11'",
    "dice-ml==0.11; python_version <= '3.11'",
    "pydotplus==2.0.2; python_version <= '3.11'",
    "deap==1.4.2; python_version <= '3.11'",
    "pydot==3.0.4; python_version <= '3.11'"
]
streamlit-app = [
    "streamlit==1.48.0; python_version < '3.12'",
    "streamlit>=1.48.0,<2; python_version >= '3.12'",
    "streamlit-sortables==0.3.1",
    "networkx==3.4.2; python_version < '3.12'",
    "networkx>=3.4.2,<4; python_version >= '3.12'",
    "lingam==1.9.1; python_version < '3.12'",
    # lingam>=1.13 pins scipy<=1.13.1, which has no wheels for Python>=3.13
    "lingam>=1.9.1,<1.13; python_version >= '3.12'",
    # semopy<2 needs portmin, which is sdist-only and fails to build on Python>=3.14
    "semopy>=2.3; python_version >= '3.12'",
    "pyvis==0.3.2"
]

[tool.setuptools.packages.find]
include = ["acfx*"]
exclude = ["acfx.benchmark*", "acfx.tests"]

[project.urls]
Homepage = "https://github.com/sbobek/acfx"
Documentation = "https://acfx.readthedocs.org"
Issues = "https://github.com/sbobek/acfx/issues"
