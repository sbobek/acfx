name: Feature request
description: Suggest an improvement or new capability for ACFX
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to ACFX. Please describe the use case and proposed behavior.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation and use case
      description: What problem or limitation would this feature address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the requested behavior or API as concretely as possible.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example usage
      description: If possible, show how the feature could be used.
      render: python

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches you considered.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add references, examples, or other information that may help evaluate the request.
